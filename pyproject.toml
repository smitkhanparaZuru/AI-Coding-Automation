[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aica"
version = "0.1.0"
description = "AI Coding Automation Engine — local CLI-first agent platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "automation", "coding", "cli", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

dependencies = [
    "typer[all]>=0.12.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "rich>=13.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "typing-extensions>=4.9",
    "httpx>=0.27",
    "tenacity>=8.3",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "neo4j>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
aica = "aica.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["aica"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
